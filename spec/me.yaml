openapi: 3.0.1

info:
  title: Liara Account API
  version: 1.0.0
  description: Retrieve current authenticated user and console information.

servers:
  - url: https://api.liara.ir

tags:
  - name: User

paths:
  /v1/me:
    get:
      tags:
        - User
      summary: Get current user and console information
      operationId: getMe
      description: >-
        Returns the authenticated user profile and console configuration.
        In team mode, the response also includes a `team` object.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user and console information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Unauthorized

  /v1/me/subscription:
    get:
      tags:
        - User
      summary: Get current subscription plan
      operationId: getMeSubscription
      description: Returns the current subscription plan of the user (or the team in team mode). Returns an empty object when there is no active plan.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current subscription plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeSubscriptionResponse"
        "401":
          description: Unauthorized

  /v1/me/two-fa:
    get:
      tags:
        - User
      summary: Get two-factor authentication status
      operationId: getMeTwoFA
      description: Returns the two-factor authentication status of the user. Both fields are omitted for teams.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Two-factor authentication status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeTwoFAResponse"
        "401":
          description: Unauthorized

  /v1/me/free-credit:
    get:
      tags:
        - User
      summary: Get remaining free credit
      operationId: getMeFreeCredit
      description: Returns the remaining free credit of the user. The field is omitted for teams.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Remaining free credit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeFreeCreditResponse"
        "401":
          description: Unauthorized

  /v1/me/git-integrations:
    get:
      tags:
        - User
      summary: Get Git integrations
      operationId: getMeGitIntegrations
      description: Returns the connected Git providers and their repository integrations.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Git integrations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeGitIntegrationsResponse"
        "401":
          description: Unauthorized

  /v1/me/utm:
    get:
      tags:
        - User
      summary: Get UTM information
      operationId: getMeUTM
      description: Returns the UTM campaign the account joined through, or null if none.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: UTM information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeUTMResponse"
        "401":
          description: Unauthorized

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    MeResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        team:
          $ref: "#/components/schemas/Team"
        databaseVersions:
          type: object
        defaultDatabaseVersions:
          type: object
        featureFlags:
          type: array
          items:
            $ref: "#/components/schemas/FeatureFlag"
        plans:
          $ref: "#/components/schemas/Plans"

    User:
      type: object
      properties:
        _id:
          type: string
        fullname:
          type: string
        email:
          type: string
        phone:
          type: string
        joined_at:
          type: string
          format: date-time
        hasPassword:
          type: boolean
        emailVerifiedAt:
          type: string
          nullable: true
        phoneVerifiedAt:
          type: string
          nullable: true
        isVerified:
          type: boolean
        isTeam:
          type: boolean
        isTeamCreator:
          type: boolean
          description: Present only in team mode.
        nationalCode:
          type: string
        invoiceIssuingEnabled:
          type: boolean
        storage:
          $ref: "#/components/schemas/Storage"
        accountType:
          type: string
        contactInfo:
          type: object
          additionalProperties: true
        contactInfoSavedAt:
          type: string
          format: date-time
          nullable: true
        minCreditAmount:
          type: number
        isManualMinCredit:
          type: boolean
        minCreditLastNotifiedAt:
          type: string
          format: date-time
          nullable: true
        hasSucceedPayment:
          type: boolean
        legacyNetworkFeature:
          type: boolean
        privateNetworkFeature:
          type: boolean
        legacyObjectStorageFeature:
          type: boolean

    Team:
      description: Present only in team mode. Contains the team profile, billing information and the member's role and permissions.
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            balance:
              type: number
            teamMemberRole:
              type: object
              properties:
                name:
                  type: string
                permissions:
                  type: array
                  items:
                    type: string
            teamMemberPermissions:
              type: array
              items:
                type: string

    Storage:
      type: object
      properties:
        namespace:
          type: string
        status:
          type: string
        planID:
          type: string
        accessKey:
          type: string
        secretKey:
          type: string

    Subscription:
      type: object
      additionalProperties: true
      properties:
        _id:
          type: string
        type:
          type: string
          example: subscription
        userID:
          type: string
        subscriptionPlanID:
          type: string
          example: free
        subscriptionPlanExpiration:
          type: string
          format: date-time
        maxTechnicalTicketsPerMonth:
          oneOf:
            - type: integer
            - type: string
          example: infinite
        subscriptionDurationType:
          type: string
          example: monthly
        technicalTicketsCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MeSubscriptionResponse:
      type: object
      properties:
        currentSubscriptionPlan:
          $ref: "#/components/schemas/Subscription"

    MeTwoFAResponse:
      type: object
      properties:
        twoFA:
          type: boolean
        lastTwoFAVerifiedAt:
          type: string
          format: date-time
          nullable: true

    MeFreeCreditResponse:
      type: object
      properties:
        remainingFreeCredit:
          type: number

    MeGitIntegrationsResponse:
      type: object
      properties:
        gitProviderIntegrations:
          type: array
          items:
            $ref: "#/components/schemas/GitProviderIntegration"
        gitRepositoryIntegrations:
          type: array
          items:
            $ref: "#/components/schemas/GitRepositoryIntegration"

    GitProviderIntegration:
      type: object

    GitRepositoryIntegration:
      type: object
  
    MeUTMResponse:
      type: object
      properties:
        utm:
          $ref: "#/components/schemas/UTM"

    UTM:
      type: object
      nullable: true
      properties:
        _id:
          type: string
        source:
          type: string
        medium:
          type: string
        campaign:
          type: string
        freeCreditAmount:
          type: number
        allowedServices:
          type: array
          items:
            type: string
        joinedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        isActive:
          type: boolean

    DatabaseVersions:
      type: object
      properties:
        mysql:
          $ref: "#/components/schemas/DatabaseVersionList"
        mariadb:
          $ref: "#/components/schemas/DatabaseVersionList"
        postgres:
          $ref: "#/components/schemas/PostgresVersionList"
        mssql:
          $ref: "#/components/schemas/DatabaseVersionList"
        mongodb:
          $ref: "#/components/schemas/DatabaseVersionList"
        redis:
          $ref: "#/components/schemas/DatabaseVersionList"
        elasticsearch:
          $ref: "#/components/schemas/DatabaseVersionList"
        rabbitmq:
          $ref: "#/components/schemas/DatabaseVersionList"
        clickhouse:
          $ref: "#/components/schemas/DatabaseVersionList"

    DatabaseVersionList:
      type: array
      items:
        type: object
        properties:
          label:
            type: string
          value:
            type: string

    PostgresVersionList:
      type: array
      items:
        type: object
        properties:
          label:
            type: string
          value:
            type: string
          postgisValue:
            type: string
          pgvectorValue:
            type: string

    FeatureFlag:
      type: object
      properties:
        key:
          type: string
        value:
          oneOf:
            - type: string
            - type: boolean
            - type: object
            - type: array

    Plans:
      type: object
      description: All available plans.
      properties:
        mail:
          type: object
          additionalProperties: true
        projects:
          type: object
          additionalProperties: true
        databases:
          type: object
          additionalProperties: true
        objectStorage:
          type: object
          additionalProperties: true
        legacyStorageService:
          type: object
          additionalProperties: true
        projectBundlePlans:
          type: object
          additionalProperties: true
        databaseBundlePlans:
          type: object
          additionalProperties: true
        subscription:
          type: object
          additionalProperties: true
